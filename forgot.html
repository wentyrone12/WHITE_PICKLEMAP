<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PickleFinder" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" /><meta name="theme-color" content="#0c1117" />
  <title>Cotabato PickleFinder — Reset password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="auth-page"><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
<main class="auth-shell auth-shell-single"><section class="auth-card-wrap"><div class="auth-card">
<a href="index.html" class="back-link">← Back to sign in</a>
<div class="brand-row compact-brand"><div class="brand-mark"><span class="ball-dot"></span></div><div><div class="brand-name">PICKLE<span>FINDER</span></div><div class="brand-sub">COTABATO CITY</div></div></div>
<div class="auth-heading"><span class="eyebrow">ACCOUNT RECOVERY</span><h2>Reset your password</h2><p>We'll send a password reset link to your email address.</p></div>
<form id="forgotForm" class="auth-form"><label>Email address</label><div class="input-wrap"><span class="icon">@</span><input id="forgotEmail" type="email" autocomplete="email" placeholder="you@example.com" required /></div><button class="primary-btn" type="submit"><span>Send reset link</span><b>→</b></button></form>
<div id="authMessage" class="auth-message" role="status"></div><p class="auth-switch"><a href="index.html">Return to sign in</a></p>
</div></section></main>
<script type="module" src="assets/auth.js"></script>
</body></html>
